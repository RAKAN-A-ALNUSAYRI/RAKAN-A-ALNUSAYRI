name: Update live profile

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate real GitHub statistics
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&hide_border=true&theme=transparent&include_all_commits=true&disable_animations=true&custom_title=GitHub%20Activity
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate live data-analysis repository card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=data-analysis-projects&show_owner=false&description_lines_count=2&hide_border=true&theme=transparent
          path: assets/data-analysis-projects.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate real contribution animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2335C8C4&color_dots=%23ebedf0,%23b6efe9,%237fe0d8,%2343c8c0,%23188f9b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2359ded4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/data-analysis-projects.svg dist/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh live profile data"
          git push

